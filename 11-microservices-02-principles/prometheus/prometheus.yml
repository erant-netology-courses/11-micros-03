global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus сам себя
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # security — /metrics
  - job_name: 'security'
    metrics_path: /metrics
    static_configs:
      - targets: ['security:3000']
        labels:
          service: 'security'

  # uploader — /metrics
  - job_name: 'uploader'
    metrics_path: /metrics
    static_configs:
      - targets: ['uploader:3000']
        labels:
          service: 'uploader'

  # storage (MinIO) — /minio/v2/metrics/cluster
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['storage:9000']
        labels:
          service: 'storage'